<!DOCTYPE html>
<html lang="en">
    <head>
    </head>
    <body>
        <!--
        Embed another webistes content within your webiste
        
        Attributes
        src- link to the resource online
        width, height- size of window(pixels)
        title-people with screen readers etc
        allow full screen- let the user go to full screen
        -->
        <iframe
           width="560"
           height="315"
           src="https://www.youtube.com/embed/IJmIGC0nwK0" 
           title="Deez Nuts (FULL VIDEO) - WelvenDaGreat (Bruh Momento)" 
           frameborder="0" 
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
           referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
            ></iframe>"
    </body>
</html>
